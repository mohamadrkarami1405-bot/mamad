<div class="hd"><h1>تصفیه‌خانه صنعتی پساب پتروشیمی</h1><p>ظرفیت طراحی: ۱۵۰ مترمکعب بر ساعت در دو قطار موازی ۷۵ مترمکعبی (۳٬۶۰۰ مترمکعب در روز). بکشید تا بچرخد، با دو انگشت یا چرخ ماوس زوم کنید، روی هر واحد بزنید</p></div>

<script>
const U=[
{n:"جداکننده API",t:"basin",c:0x6d7b80,w:"آبی تیره",d:"نخستین مرحله: روغن آزاد و هیدروکربن‌های سبک بر اثر اختلاف چگالی روی سطح جمع و با اسکیمر برداشته می‌شوند. رسوبات سنگین ته‌نشین می‌شوند.",r:"حذف ۶۰ تا ۹۰٪ روغن آزاد",s:"زمان ماند ۲۰ دقیقه، حجم حدود ۲۵ مترمکعب"},
{n:"مخزن متعادل‌سازی",t:"tank",c:0x8a9a9f,w:"",d:"نوسان دبی و غلظت پساب واحدهای مختلف را یکنواخت می‌کند تا بخش‌های بعدی با بار پایدار کار کنند. با همزن یا هواده مخلوط می‌شود.",r:"یکنواخت‌سازی بار آلودگی",s:"زمان ماند ۶ ساعت، حجم حدود ۴۵۰ مترمکعب"},
{n:"فلوتاسیون DAF",t:"daf",c:0x5f7f8a,w:"",d:"هوادهی DAF با سیستم ریسایکل تحت فشار (پرشر وسل): بخشی از پساب خروجی DAF با پمپ و هوای کمپرسور در مخزن تحت فشار اشباع می‌شود و با کاهش فشار در ورودی حوض حباب‌های ریز تولید می‌کند. این حباب‌ها روغن امولسیونی و ذرات را به سطح می‌برند. معمولاً همراه با منعقدکننده و لخته‌ساز.",x:"با تزریق حباب‌های ریز هوا، روغن امولسیونی و ذرات معلق به سطح می‌آیند و جمع‌آوری می‌شوند. معمولاً همراه با منعقدکننده و لخته‌ساز.",r:"حذف روغن امولسیونی و TSS",s:"بار سطحی ۷٫۵ مترمکعب بر مترمربع در ساعت، سطح حدود ۱۰ مترمربع، سیستم تحت فشار (پرشر وسل ۴ تا ۶ بار) با ریسایکل ۲۰٪ (۱۵ m³/h برای هر قطار)"},
{n:"حوض هوادهی بیولوژیکی",t:"aer2",a:"محاسبه برای کل تصفیه‌خانه: با فرض COD ورودی ۱۰۰۰ و خروجی ۱۰۰ mg/L بار حذف‌شده حدود ۱۳۵ kg/h و نیاز اکسیژن COD حدود ۱۲۰ kg O2/h و با نیتریفیکاسیون آمونیاک (فرض ۴۰ mg/L NH4-N، حذف ۹۰٪، حدود ۲۵ kg O2/h و مصرف قلیائیت حدود ۳۹ kg CaCO3/h) در مجموع حدود ۱۴۶ kg O2/h است. با بازده انتقال میدانی حدود ۱۵٪ (عمق ۵ متر) هوای لازم حدود ۳۵۰۰ Nm3/h و با ضریب اطمینان ۲۰٪ حدود ۴۲۰۰ Nm3/h (۲۱۰۰ برای هر قطار) می‌شود. پیشنهاد: ایستگاه بلوئر مشترک: ۳ بلوئر (۱ فعال برای هر قطار + ۱ رزرو مشترک) هر کدام حدود ۲۱۰۰ Nm3/h با اینورتر، کنترل شده با پروب DO در محدوده ۱٫۵ تا ۲٫۵ mg/L",c:0x4f6b73,w:"",d:"فرایند لجن فعال با دیفیوزرهای دیسکی حباب ریز کف حوض که هوا را از بلوئر می‌گیرند و اکسیژن را با بازده بالا منتقل می‌کنند. راه‌اندازی با تلقیح لجن تازه فعال انجام می‌شود و در بهره‌برداری، لجن تازه تهنشین‌شده کلاریفایر با خط برگشت لجن (RAS) به حوض می‌رسد تا غلظت میکروب‌ها ثابت بماند. میکروب‌ها ترکیبات آلی محلول (COD و BOD) را مصرف می‌کنند.",x:"میکروارگانیسم‌های هوازی با کمک هوادهی، ترکیبات آلی محلول (COD و BOD) را مصرف می‌کنند. قلب فرایند تصفیه است.",r:"حذف ۸۰ تا ۹۵٪ COD",s:"MLSS حدود ۳۰۰۰ تا ۴۰۰۰ mg/L، برگشت لجن ۵۰ تا ۱۰۰٪ دبی (هر قطار ۳۸ تا ۷۵ m³/h)، زمان ماند ۱۶ ساعت، حجم حدود ۱۲۰۰ مترمکعب برای هر قطار"},
{n:"کلاریفایر ثانویه",t:"clar",c:0x7d8d92,w:"",d:"لجن بیولوژیکی از پساب جدا می‌شود. بخشی از لجن به حوض هوادهی برمی‌گردد و مازاد آن به واحد آبگیری می‌رود.",r:"جداسازی لجن فعال",s:"بار سطحی ۰٫۷۵ متر بر ساعت، قطر حدود ۱۱٫۳ متر برای هر قطار"},
{n:"راکتور بیوفیلم MBBR",t:"mbbr",c:0x4f7a6a,w:"",d:"مرحله پولیش بیولوژیکی جایگزین فیلتر شنی: مدیاهای پلاستیکی متحرک داخل حوض هوادهی شده، میکروب‌های چسبیده (بیوفیلم) را نگه می‌دارند که ترکیبات آلی مقاوم و نیتروژن را مصرف می‌کنند.",x:"می‌گیرد و کربن فعال، ترکیبات آلی مقاوم و رنگ و بو را جذب می‌کند.",r:"پولیش بیولوژیکی و حذف نیتروژن",s:"زمان ماند ۳ ساعت، حجم حدود ۲۲۵ مترمکعب برای هر قطار، پرشدگی مدیا ۴۰٪، هوادهی از ایستگاه بلوئر مشترک (هوای MBBR جدا از محاسبهٔ بلوئرهای حوض هوادهی است و باید اضافه شود)"},
{n:"مخزن پساب تصفیه‌شده",t:"tank",c:0x3d8aa6,w:"",d:"پساب پس از گندزدایی و کنترل کیفیت ذخیره می‌شود تا برای استفادهٔ مجدد در برج‌های خنک‌کننده یا تخلیه مطابق استاندارد محیط‌زیست آماده باشد.",r:"تخلیه به دریا مطابق استانداردهای تخلیه",s:"زمان ماند ۲ ساعت، حجم حدود ۱۵۰ مترمکعب برای هر قطار"},
{n:"آبگیری لجن (سانتریفیوژ)",t:"cent",c:0x7a6a4f,w:"",d:"واحد مشترک برای هر دو قطار. لجن مازاد دو کلاریفایر (و لجن DAF) با پلیمر مخلوط و وارد دکانتر سانتریفیوژ می‌شود. نیروی گریز از مرکز، کیک نیمه‌خشک را از فاز زلال (سانترات) جدا می‌کند. کیک به بین جمع‌آوری می‌رود و سانترات به ورودی تصفیه‌خانه برمی‌گردد.",r:"کیک با خشکی ۲۰ تا ۲۸٪",s:"دبی خوراک حدود ۵ تا ۸ مترمکعب بر ساعت (برآورد، وابسته به غلظت لجن)، مصرف پلیمر ۴ تا ۸ کیلوگرم بر تن ماده خشک"},
{n:"پکیج شیمیایی (pH و انعقاد)",t:"chem",c:0x6b7b80,w:"",d:"واحد مشترک برای هر دو قطار: چهار مخزن با رنگ مجزا در حوضچه مهار نشت: اسید و سود برای تنظیم pH (با پروب و کنترلر، روی مخزن متعادل‌سازی)، منعقدکننده (PAC) و پلیمر (با همزن برای تهیه محلول) برای لخته‌سازی قبل از DAF. هر ماده پمپ دوزینگ جداگانه دارد. چهار خط تزریق (دو خط برای هر قطار) به مخزن متعادل‌سازی و DAF می‌رود.",r:"تنظیم pH روی ۶٫۵ تا ۸٫۵ و انعقاد ذرات",s:"PAC حدود ۵۰ تا ۱۵۰ mg/L (۸ تا ۲۳ kg/h)، پلیمر ۱ تا ۳ mg/L (۰٫۱۵ تا ۰٫۴۵ kg/h)، اسید و سود ۲۰ تا ۱۰۰ mg/L بسته به قلیائیت"}];

 const g=new THREE.Group();g.position.set(i<NM?X0+i*G:(i==NM?X0+4*G:X0+1.5*G),0,i<NM?ZO:0);g.userData.i=i;

 }else if(u.t=="tank"){

 }else if(u.t=="clar"){

  add(g,new THREE.Mesh(new THREE.CylinderGeometry(.5,.5,2.6,16),M(0x55666b)),0,1.3,0);
 }else if(u.t=="mbbr"){

 }else if(u.t=="chem"){
